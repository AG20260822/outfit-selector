<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local AI Test</title>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f7f6f3;
        margin: 0;
        padding: 24px;
        color: #111;
    }

    .card {
        max-width: 650px;
        margin: 0 auto;
        background: white;
        border-radius: 24px;
        padding: 24px;
        box-sizing: border-box;
    }

    h1 {
        font-family: Georgia, serif;
        font-size: 42px;
        line-height: 1;
        margin-top: 0;
    }

    p {
        line-height: 1.5;
        color: #666;
    }

    input {
        width: 100%;
        font-size: 16px;
        margin: 16px 0;
    }

    img {
        width: 100%;
        max-height: 500px;
        object-fit: contain;
        border-radius: 18px;
        display: none;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 18px;
        font-size: 18px;
        font-weight: 600;
        background: #111;
        color: white;
        margin-top: 16px;
    }

    button:disabled {
        opacity: 0.45;
    }

    .status {
        margin-top: 20px;
        padding: 16px;
        border-radius: 16px;
        background: #eee;
        line-height: 1.5;
    }

    .result {
        margin-top: 20px;
        padding: 20px;
        border-radius: 18px;
        background: #f1f1f1;
        display: none;
    }

    .result h2 {
        margin-top: 0;
    }

    .prediction {
        padding: 14px 0;
        border-bottom: 1px solid #ddd;
        font-size: 18px;
    }

    .prediction:last-child {
        border-bottom: none;
    }
</style>
</head>

<body>

<div class="card">

    <h1>Local AI test</h1>

    <p>
        Choose a clothing photo from your phone.
        The image analysis runs locally in your browser.
    </p>

    <input
        id="photoInput"
        type="file"
        accept="image/*"
    >

    <img id="preview" alt="Selected clothing photo">

    <button id="analyzeButton" disabled>
        Analyze image
    </button>

    <div id="status" class="status">
        Loading local AI…
    </div>

    <div id="result" class="result">
        <h2>AI result</h2>
        <div id="predictions"></div>
    </div>

</div>

<script type="module">

import {
    pipeline,
    RawImage
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const analyzeButton = document.getElementById("analyzeButton");
const status = document.getElementById("status");
const result = document.getElementById("result");
const predictions = document.getElementById("predictions");

let classifier = null;
let imageFile = null;


// --------------------------------------------------
// LOAD LOCAL AI
// --------------------------------------------------

async function loadAI() {

    try {

        status.textContent =
            "Loading small local AI model…";

        classifier = await pipeline(
            "image-classification",
            "Xenova/mobilevit-small"
        );

        status.innerHTML =
            "✓ Local AI loaded.<br>" +
            "Choose a clothing photo.";

        if (imageFile) {
            analyzeButton.disabled = false;
        }

    } catch (error) {

        console.error(error);

        status.innerHTML =
            "<strong>Could not load local AI.</strong><br><br>" +
            "Technical error:<br>" +
            escapeHTML(error.message);
    }
}


// --------------------------------------------------
// PHOTO SELECTION
// --------------------------------------------------

photoInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    imageFile = file;

    const url = URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

    result.style.display = "none";

    status.innerHTML =
        "Photo selected.<br>" +
        "Ready to analyze.";

    if (classifier) {
        analyzeButton.disabled = false;
    }

});


// --------------------------------------------------
// ANALYZE PHOTO
// --------------------------------------------------

analyzeButton.addEventListener("click", async function() {

    if (!classifier || !imageFile) {
        return;
    }

    analyzeButton.disabled = true;

    result.style.display = "none";

    status.textContent =
        "Analyzing image locally…";

    try {

        /*
         * IMPORTANT:
         *
         * Do not pass the HTML <img> element directly
         * into Transformers.js.
         *
         * Instead, convert the selected phone photo
         * into a Blob and then into RawImage.
         */

        const rawImage =
            await RawImage.fromBlob(imageFile);

        console.log(
            "Image loaded:",
            rawImage.width,
            "x",
            rawImage.height
        );

        const output = await classifier(
            rawImage,
            {
                topk: 5
            }
        );

        console.log("AI output:", output);

        predictions.innerHTML = "";

        output.forEach(item => {

            const div =
                document.createElement("div");

            div.className = "prediction";

            const percentage =
                Math.round(item.score * 100);

            div.innerHTML =
                "<strong>" +
                escapeHTML(item.label) +
                "</strong>" +
                " — " +
                percentage +
                "%";

            predictions.appendChild(div);

        });

        result.style.display = "block";

        status.innerHTML =
            "✓ Analysis complete.<br>" +
            "The photo was processed locally in your browser.";

    } catch (error) {

        console.error(error);

        status.innerHTML =
            "<strong>Analysis failed.</strong><br><br>" +
            escapeHTML(error.message);
    }

    analyzeButton.disabled = false;

});


// --------------------------------------------------
// BASIC HTML ESCAPING
// --------------------------------------------------

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// --------------------------------------------------
// START
// --------------------------------------------------

loadAI();

</script>

</body>
</html>
