<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local AI Test</title>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f7f6f3;
        margin: 0;
        padding: 24px;
        color: #111;
    }

    .card {
        max-width: 650px;
        margin: 0 auto;
        background: white;
        border-radius: 24px;
        padding: 24px;
        box-sizing: border-box;
    }

    h1 {
        font-family: Georgia, serif;
        font-size: 42px;
        line-height: 1;
        margin-top: 0;
    }

    input {
        width: 100%;
        font-size: 16px;
        margin: 16px 0;
    }

    img {
        width: 100%;
        max-height: 500px;
        object-fit: contain;
        border-radius: 18px;
        display: none;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 18px;
        font-size: 18px;
        font-weight: 600;
        background: #111;
        color: white;
        margin-top: 16px;
    }

    button:disabled {
        opacity: 0.45;
    }

    .status {
        margin-top: 20px;
        padding: 16px;
        border-radius: 16px;
        background: #eee;
        line-height: 1.5;
    }

    .result {
        margin-top: 20px;
        padding: 20px;
        border-radius: 18px;
        background: #f1f1f1;
        display: none;
    }

    .result h2 {
        margin-top: 0;
    }

    .prediction {
        padding: 12px 0;
        border-bottom: 1px solid #ddd;
        font-size: 18px;
    }
</style>
</head>

<body>

<div class="card">

    <h1>Local AI test</h1>

    <p>
        This test runs the image model directly in your browser.
        Your photo is not uploaded to our server.
    </p>

    <input
        id="photoInput"
        type="file"
        accept="image/*"
    >

    <img id="preview">

    <button id="analyzeButton" disabled>
        Analyze image
    </button>

    <div id="status" class="status">
        Loading local AI…
    </div>

    <div id="result" class="result">
        <h2>AI result</h2>
        <div id="predictions"></div>
    </div>

</div>

<script type="module">

import { pipeline } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const analyzeButton = document.getElementById("analyzeButton");
const status = document.getElementById("status");
const result = document.getElementById("result");
const predictions = document.getElementById("predictions");

let classifier = null;
let imageFile = null;

async function loadAI() {

    try {

        status.textContent =
            "Loading small local AI model…";

        classifier = await pipeline(
            "image-classification",
            "Xenova/mobilevit-small"
        );

        status.textContent =
            "✓ Local AI loaded. Choose a clothing photo.";

        analyzeButton.disabled = !imageFile;

    } catch (error) {

        console.error(error);

        status.innerHTML =
            "<strong>Could not load local AI.</strong><br><br>" +
            "Technical error:<br>" +
            error.message;
    }
}

photoInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    imageFile = file;

    const url = URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

    result.style.display = "none";

    if (classifier) {
        analyzeButton.disabled = false;
    }

});

analyzeButton.addEventListener("click", async function() {

    if (!classifier || !imageFile) {
        return;
    }

    analyzeButton.disabled = true;

    status.textContent =
        "Analyzing image locally…";

    result.style.display = "none";

    try {

        const output = await classifier(preview, {
            topk: 5
        });

        console.log(output);

        predictions.innerHTML = "";

        output.forEach(item => {

            const div = document.createElement("div");

            div.className = "prediction";

            const percentage =
                Math.round(item.score * 100);

            div.innerHTML =
                "<strong>" +
                item.label +
                "</strong>" +
                " — " +
                percentage +
                "%";

            predictions.appendChild(div);

        });

        result.style.display = "block";

        status.innerHTML =
            "✓ Analysis complete.<br>" +
            "The image was processed locally in your browser.";

    } catch (error) {

        console.error(error);

        status.innerHTML =
            "<strong>Analysis failed.</strong><br><br>" +
            error.message;
    }

    analyzeButton.disabled = false;

});

loadAI();

</script>

</body>
</html>
